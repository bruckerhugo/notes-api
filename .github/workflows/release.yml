name: Release

# On a v* tag: run CI, build and smoke-test the standalone executables on
# Linux, Windows and macOS, then publish them in a GitHub Release.
# On pull requests touching the packaging: build and smoke-test only.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "desktop/app.py"
      - "desktop/embedded_server.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # Pull requests already run CI through ci.yml.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.name }})
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            asset: notes-linux-x86_64.tar.gz
          - name: windows
            os: windows-latest
            asset: notes-windows-x86_64.exe
          - name: macos
            os: macos-latest
            asset: notes-macos-arm64.zip
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install ".[desktop,build]"
      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/notes.spec

      # Start the real executable: embedded API, API round trip, window, exit.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: ./dist/notes --smoke-test --smoke-log smoke.log
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: ./dist/Notes.app/Contents/MacOS/notes --smoke-test --smoke-log smoke.log
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        # Windowed executable (no console): check its exit code and read the result from
        # the log file. Windows runners have a desktop session, so use the native Qt
        # platform like real users. The app's own watchdog exits after 60 s if it hangs.
        run: |
          Remove-Item Env:QT_QPA_PLATFORM
          $p = Start-Process -FilePath dist\notes.exe -ArgumentList '--smoke-test','--smoke-log','smoke.log' -PassThru
          if (-not $p.WaitForExit(150000)) {
            Stop-Process -Id $p.Id -Force
            throw "smoke test timed out"
          }
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
      - name: Smoke test log
        if: always()
        shell: bash
        run: cat smoke.log 2>/dev/null || echo "no smoke.log written"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist notes
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Notes.app ${{ matrix.asset }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp dist/notes.exe ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the project version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version v$version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
