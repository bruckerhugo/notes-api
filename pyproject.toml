[project]
name = "notes-api"
version = "0.1.0"
description = "API REST de notes (FastAPI + SQLite) avec interface desktop"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
desktop = [
    "httpx",
    "PySide6-Essentials>=6.7",
]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest",
    "httpx",
    "pytest-cov",
    "pytest-qt",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["backend*", "desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["backend", "desktop"]
branch = true
# Three lines that only call desktop.app.main(), which is tested.
omit = ["desktop/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
